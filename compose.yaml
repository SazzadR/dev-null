services:
    open-webui:
        image: ghcr.io/open-webui/open-webui:slim
        restart: unless-stopped
        ports:
            - "127.0.0.1:3000:8080"
        environment:
            OLLAMA_BASE_URL: "http://ollama:11434"
            ENABLE_OPENAI_API: "${ENABLE_OPENAI_API:-False}"
            OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
            OPENAI_API_BASE_URL: "https://api.openai.com/v1"
            ENABLE_PERSISTENT_CONFIG: "False"
            DEFAULT_MODEL_METADATA: >-
                {"capabilities":{"file_context":false,"vision":false,"file_upload":false,"web_search":false,"image_generation":false,"code_interpreter":false,"terminal":false,"citations":false,"status_updates":false,"usage":false,"memory":false,"builtin_tools":false},"toolIds":[],"filterIds":[],"actionIds":[],"skillIds":[],"defaultFeatureIds":[],"suggestion_prompts":[]}
        volumes:
            - open-webui-data:/app/backend/data
        depends_on:
            ollama:
                condition: service_healthy

    ollama:
        image: ollama/ollama:latest
        restart: unless-stopped
        environment:
            OLLAMA_HOST: "0.0.0.0:11434"
            OLLAMA_CONTEXT_LENGTH: "4096"
            OLLAMA_NUM_PARALLEL: "1"
            OLLAMA_MAX_LOADED_MODELS: "1"
            OLLAMA_KEEP_ALIVE: "-1"
        volumes:
            - ollama-data:/root/.ollama
        deploy:
            resources:
                reservations:
                    devices:
                        -   driver: nvidia
                            count: 1
                            capabilities: [ gpu ]
        healthcheck:
            test: [ "CMD", "ollama", "list" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

volumes:
    open-webui-data:
    ollama-data:
