apiVersion: apps/v1
kind: Deployment
metadata:
    name: demo-app-deployment
spec:
    replicas: 3
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    selector:
        matchLabels:
            app: demo-app
    template:
        metadata:
            labels:
                app: demo-app
        spec:
            containers:
                -   name: demo-app-container
                    image: sazzadr/demo-app:v5
                    readinessProbe:
                        periodSeconds: 1
                        successThreshold: 5
                        httpGet:
                            port: 5000
                            path: /
                    livenessProbe:
                        periodSeconds: 30
                        httpGet:
                            port: 5000
                            path: /

---

apiVersion: v1
kind: Service
metadata:
    name: demo-app-service
spec:
    type: NodePort
    selector:
        app: demo-app
    ports:
        -   port: 5000
            nodePort: 30001

---

apiVersion: v1
kind: Service
metadata:
    name: nginx-service
spec:
    type: ClusterIP
    selector:
        app: nginx
    ports:
        -   port: 80
            targetPort: 80

---

apiVersion: v1
kind: Pod
metadata:
    name: nginx
    labels:
        app: nginx
spec:
    containers:
        -   name: nginx-container
            image: nginx

