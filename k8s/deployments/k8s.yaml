apiVersion: apps/v1
kind: Deployment
metadata:
    name: demo-app
spec:
    replicas: 3
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    selector:
        matchLabels:
            app: demo-app
    template:
        metadata:
            labels:
                app: demo-app
        spec:
            containers:
                -   name: demo-app-container
                    image: sazzadr/demo-app:v2
                    readinessProbe:
                        periodSeconds: 1
                        successThreshold: 5
                        httpGet:
                            path: /
                            port: 5000
                    livenessProbe:
                        periodSeconds: 30
                        httpGet:
                            path: /
                            port: 5000
