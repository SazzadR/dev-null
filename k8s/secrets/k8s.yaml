apiVersion: v1
kind: ConfigMap
metadata:
    name: demo-app-configmap
data:
    MESSAGE: "ConfigMap is working!"

---

apiVersion: apps/v1
kind: Deployment
metadata:
    name: demo-app-deployment
spec:
    replicas: 3
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
    selector:
        matchLabels:
            app: demo-app
    template:
        metadata:
            labels:
                app: demo-app
        spec:
            containers:
                -   name: demo-app-container
                    image: sazzadr/demo-app:v8
                    env:
                        -   name: MESSAGE
                            valueFrom:
                                configMapKeyRef:
                                    name: demo-app-configmap
                                    key: MESSAGE
                        -   name: SECRET_KEY
                            valueFrom:
                                secretKeyRef:
                                    name: demo-app-secret
                                    key: SECRET_KEY
                    readinessProbe:
                        periodSeconds: 1
                        successThreshold: 5
                        httpGet:
                            port: 5000
                            path: /api
                    livenessProbe:
                        periodSeconds: 30
                        httpGet:
                            port: 5000
                            path: /api

---

apiVersion: v1
kind: Service
metadata:
    name: demo-app-service
spec:
    type: ClusterIP
    selector:
        app: demo-app
    ports:
        -   port: 5000
            targetPort: 5000

---

apiVersion: apps/v1
kind: Deployment
metadata:
    name: nginx-deployment
spec:
    replicas: 1
    selector:
        matchLabels:
            app: nginx
    template:
        metadata:
            labels:
                app: nginx
        spec:
            containers:
                -   name: nginx-container
                    image: nginx

---

apiVersion: v1
kind: Service
metadata:
    name: nginx-service
spec:
    type: ClusterIP
    selector:
        app: nginx
    ports:
        -   port: 80
            targetPort: 80

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: root-ingress
spec:
    ingressClassName: traefik
    rules:
        -   host: nginx.local.dev
            http:
                paths:
                    -   path: /
                        pathType: Prefix
                        backend:
                            service:
                                name: nginx-service
                                port:
                                    number: 80
        -   host: api.local.dev
            http:
                paths:
                    -   path: /api
                        pathType: Prefix
                        backend:
                            service:
                                name: demo-app-service
                                port:
                                    number: 5000
